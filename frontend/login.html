<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NewsHub - Entra na tua conta">
  <title>Entrar — NewsHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="theme.js"></script>
</head>
<body>
  <div style="position:fixed; top:16px; right:16px; z-index:100;">
    <button id="themeToggleBtn" style="background:rgba(99,102,241,0.15); border:1px solid rgba(99,102,241,0.3); cursor:pointer; width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:all 150ms; color:var(--color-primary);" aria-label="Mudar tema"></button>
  </div>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <div style="display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:var(--spacing-sm);">
          <div style="width:48px; height:48px; background:linear-gradient(135deg,var(--color-primary),var(--color-primary-dark)); border-radius:14px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-md);">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="white" stroke-width="2" style="width:28px;height:28px;">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"/>
            </svg>
          </div>
          <h1 style="background:linear-gradient(135deg,var(--color-primary),var(--color-accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text; font-size:2rem; font-weight:900; margin:0;">NewsHub</h1>
        </div>
        <p>Agregador de notícias inteligente com IA</p>
      </div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="teu@email.com" required aria-label="Email">
          <div class="form-error" id="emailError"></div>
        </div>
        <div class="form-group">
          <label for="password" class="form-label">Palavra-passe</label>
          <input type="password" id="password" name="password" class="form-input" placeholder="Mínimo 8 caracteres" required aria-label="Palavra-passe">
          <div class="form-error" id="passwordError"></div>
        </div>
        <div class="form-error" id="generalError" style="text-align:center; margin-bottom:var(--spacing-md);"></div>
        <button type="submit" class="btn btn-primary" style="width:100%; padding:14px; font-size:var(--font-size-base);">
          Entrar
        </button>
      </form>

      <div class="auth-divider">
        <p>Não tens conta? <a href="register.html">Criar conta grátis</a></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      ['emailError','passwordError','generalError'].forEach(id => {
        document.getElementById(id).textContent = '';
        document.getElementById(id).classList.remove('visible');
      });
      if (!email) { document.getElementById('emailError').textContent = 'Email é obrigatório'; document.getElementById('emailError').classList.add('visible'); return; }
      if (!password) { document.getElementById('passwordError').textContent = 'Palavra-passe é obrigatória'; document.getElementById('passwordError').classList.add('visible'); return; }
      await handleLogin(email, password);
    });
  </script>
</body>
</html>
