<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NewsHub - Os meus favoritos">
  <title>Favoritos — NewsHub</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- NAVBAR -->
  <nav role="navigation" aria-label="Navegação principal">
    <div class="navbar">
      <div class="navbar-logo">📰 NewsHub</div>
      
      <ul class="navbar-categories" id="navbarCategories" role="menubar">
        <!-- Preenchido dinamicamente por JavaScript -->
      </ul>

      <div class="navbar-right">
        <div class="navbar-user">
          <span id="userNameDisplay">Utilizador</span>
        </div>
        <div class="navbar-icons">
          <button 
            class="navbar-icon" 
            id="preferencesBtn" 
            title="Preferências" 
            aria-label="Ir para preferências"
          >
            ⚙️
          </button>
          <button 
            class="navbar-icon" 
            id="dashboardBtn" 
            title="Dashboard" 
            aria-label="Voltar ao dashboard"
          >
            🏠
          </button>
          <button 
            class="navbar-icon" 
            id="logoutBtn" 
            title="Terminar sessão" 
            aria-label="Terminar sessão"
          >
            🚪
          </button>
        </div>
        <button class="hamburger" id="hamburgerBtn" aria-label="Abrir menu">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTENT -->
  <main role="main" style="margin-top: 70px;">
    <div class="container">
      <h1 style="margin-bottom: var(--spacing-lg); margin-top: var(--spacing-lg);">❤️ Os Meus Favoritos</h1>
      
      <!-- Spinner de carregamento -->
      <div class="spinner" id="loadingSpinner"></div>

      <!-- Grid de favoritos -->
      <div class="news-grid" id="favoritesGrid">
        <!-- Preenchido dinamicamente por JavaScript -->
      </div>

      <!-- Estado vazio -->
      <div class="empty-state" id="emptyState" style="display: none;">
        <div class="empty-state-icon">📭</div>
        <h2 class="empty-state-title">Nenhum favorito guardado</h2>
        <p class="empty-state-message">Começa a adicionar notícias aos teus favoritos do dashboard.</p>
        <a href="index.html" class="btn btn-primary empty-state-button" style="margin-top: var(--spacing-md); display: inline-block;">
          Voltar ao Dashboard
        </a>
      </div>

      <!-- Estado de erro -->
      <div class="error-state" id="errorState" style="display: none;">
        <div class="error-state-icon">⚠️</div>
        <h3 class="error-state-title">Erro ao carregar favoritos</h3>
        <p class="error-state-message" id="errorMessage"></p>
        <button class="btn btn-primary error-state-button" id="retryButton">Tentar Novamente</button>
      </div>
    </div>
  </main>

  <!-- MODAL: RESUMO IA -->
  <div class="modal-overlay" id="summaryModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">📝 Resumo Inteligente</h3>
        <button class="modal-close" id="closeSummaryModal" aria-label="Fechar modal">✕</button>
      </div>
      <div class="modal-body">
        <div class="spinner" id="summarySpinner"></div>
        <p id="summaryContent" style="display: none; line-height: var(--line-height-relaxed);"></p>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICAÇÃO -->
  <div class="toast" id="toast" role="alert" aria-live="polite"></div>

  <!-- FOOTER -->
  <footer role="contentinfo">
    <p>&copy; 2025 NewsHub — Agregador de notícias inteligente</p>
  </footer>

  <script src="app.js"></script>
  <script>
    // Inicialização da página favorites.html
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Verificar autenticação
      if (!await checkAuth()) {
        window.location.href = 'login.html';
        return;
      }

      // 2. Carregar favoritos
      await loadFavorites();

      // 3. Event listeners
      document.getElementById('logoutBtn').addEventListener('click', handleLogout);
      document.getElementById('dashboardBtn').addEventListener('click', () => {
        window.location.href = 'index.html';
      });
      document.getElementById('preferencesBtn').addEventListener('click', () => {
        window.location.href = 'preferences.html';
      });
      document.getElementById('retryButton').addEventListener('click', loadFavorites);
      document.getElementById('closeSummaryModal').addEventListener('click', closeSummaryModal);

      // Fechar modal ao clicar no overlay
      document.getElementById('summaryModal').addEventListener('click', (e) => {
        if (e.target.id === 'summaryModal') {
          closeSummaryModal();
        }
      });

      // Preencher navbar com categorias
      await initNavbarCategories();
    });

    function closeSummaryModal() {
      document.getElementById('summaryModal').classList.remove('visible');
      document.getElementById('summarySpinner').classList.remove('visible');
      document.getElementById('summaryContent').style.display = 'none';
    }
  </script>
</body>
</html>
